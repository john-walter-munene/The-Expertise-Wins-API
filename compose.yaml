services:
  # Host ports are this project's own range, overridable from the environment:
  #   web 3200 | api 3201 | db 5441   (DrillKe 3100/4100/5440, AppKings 3300/3301/5442)
  # The container-side ports stay fixed. 
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        if ! node -e "require.resolve('concurrently')" >/dev/null 2>&1; then
          npm ci
        fi
        exec npm run dev
    init: true
    env_file:
      - ./backend/.env
      - ./frontend/.env
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - backend_node_modules:/workspace/backend/node_modules
      - frontend_node_modules:/workspace/frontend/node_modules
      - cli_node_modules:/workspace/cli/node_modules
      - frontend_next_cache:/workspace/frontend/.next
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tew}:${POSTGRES_PASSWORD:-tew_local_dev}@db:5432/${POSTGRES_DB:-expertise_wins}?schema=public
      PORT: ${API_PORT:-3201}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_PORT:-3200}}
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${API_PORT:-3201}:${API_PORT:-3201}"
      - "${WEB_PORT:-3200}:3001"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expertise_wins}
      POSTGRES_USER: ${POSTGRES_USER:-tew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tew_local_dev}
    ports:
      # Loopback only: nothing outside this machine needs the database port.
      - "127.0.0.1:${DB_PORT:-5441}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  root_node_modules:
  backend_node_modules:
  frontend_node_modules:
  cli_node_modules:
  frontend_next_cache:
  postgres_data:
